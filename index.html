<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu Điểm KPI Đơn Vị Địa Phương</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #004085;
        }
        .result-card {
            display: none;
            border-top: 2px solid #0056b3;
            padding-top: 20px;
            margin-top: 20px;
        }
        .score-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 20px 0;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
        }
        .score-block {
            text-align: center;
        }
        .score-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        /* Màu sắc trạng thái điểm và xếp loại */
        .rank-xuat-sac { color: #28a745 !important; }
        .rank-tot { color: #0056b3 !important; }
        .rank-kha { color: #fd7e14 !important; }
        .rank-trung-binh { color: #dc3545 !important; }

        .reason-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .reason-table th, .reason-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        .reason-table th {
            background-color: #f8f9fa;
        }
        .error-msg {
            color: #dc3545;
            text-align: center;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tra Cứu Điểm KPI Địa Phương</h2>
    
    <div class="search-box">
        <input type="text" id="unitInput" list="unitList" placeholder="Nhập hoặc chọn tên đơn vị từ gợi ý...">
        <datalist id="unitList"></datalist>
        <button onclick="searchKPI()">Tra cứu</button>
    </div>

    <p id="errorMsg" class="error-msg">Không tìm thấy đơn vị này. Vui lòng chọn đúng tên trong danh sách gợi ý!</p>

    <div id="resultCard" class="result-card">
        <h3>Đơn vị: <span id="resName">...</span></h3>
        
        <div class="score-container">
            <div class="score-block">
                <div class="score-title">Tổng điểm KPI</div>
                <div id="resScore" class="score">0 / 100</div>
            </div>
            <div class="score-block">
                <div class="score-title">Xếp loại</div>
                <div id="resRank" class="score" style="text-transform: uppercase;">...</div>
            </div>
        </div>
        
        <h4>Chi tiết căn cứ trừ điểm:</h4>
        <table class="reason-table">
            <thead>
                <tr>
                    <th>Nội dung sai phạm / Chậm trễ</th>
                    <th>Điểm trừ</th>
                </tr>
            </thead>
            <tbody id="resDeductions"></tbody>
        </table>
    </div>
</div>

<script>
    let kpiData = {};

    window.onload = function() {
        fetch('data.csv?t=' + new Date().getTime())
            .then(response => response.text())
            .then(text => {
                parseCSV(text);
                generateDataList();
            })
            .catch(err => {
                console.error("Lỗi tải file dữ liệu:", err);
            });
    };

    function parseCSV(text) {
        const lines = text.trim().split('\n');
        if (lines.length <= 1) return;

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;

            const columns = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                                    .map(col => col.replace(/^"|"$/g, '').trim());

            if (columns.length < 2) continue;

            const unitName = columns[0];
            const score = parseInt(columns[1]) || 100;
            const reason = columns[2] || "";
            const rank = columns[3] || ""; // Đọc dữ liệu xếp loại từ cột thứ 4

            if (!unitName) continue;
            const key = unitName.toLowerCase().replace(/\s+/g, ' ');

            if (!kpiData[key]) {
                kpiData[key] = {
                    name: unitName,
                    score: score,
                    rank: rank,
                    deductions: []
                };
            }

            if (reason && reason !== "" && !["không", "không có", "0"].includes(reason.toLowerCase())) {
                const numberMatch = reason.match(/\d+/);
                let pointStr = "Bị trừ";
                if (numberMatch) {
                    pointStr = "-" + numberMatch[0];
                }
                
                kpiData[key].deductions.push({
                    reason: reason,
                    points: pointStr
                });
            }
        }
    }

    function generateDataList() {
        const datalist = document.getElementById("unitList");
        datalist.innerHTML = "";
        for (const key in kpiData) {
            let option = document.createElement("option");
            option.value = kpiData[key].name;
            datalist.appendChild(option);
        }
    }

    function searchKPI() {
        const input = document.getElementById("unitInput").value.trim().toLowerCase().replace(/\s+/g, ' ');
        const resultCard = document.getElementById("resultCard");
        const errorMsg = document.getElementById("errorMsg");
        const resDeductions = document.getElementById("resDeductions");

        resDeductions.innerHTML = "";
        let foundData = kpiData[input];

        if (foundData) {
            errorMsg.style.display = "none";
            resultCard.style.display = "block";
            
            document.getElementById("resName").innerText = foundData.name;
            
            // Hiển thị điểm số
            const scoreDiv = document.getElementById("resScore");
            scoreDiv.innerText = foundData.score + " / 100";
            
            // Xử lý hiển thị xếp loại và đổi màu sắc tương ứng
            const rankDiv = document.getElementById("resRank");
            let rankText = foundData.rank;
            
            // Dự phòng nếu cột xếp loại trên Sheet bị trống, hệ thống tự tính toán loại
            if (!rankText) {
                if (foundData.score >= 90) rankText = "Xuất sắc";
                else if (foundData.score >= 80) rankText = "Tốt";
                else if (foundData.score >= 70) rankText = "Khá";
                else rankText = "Trung bình";
            }
            rankDiv.innerText = rankText;

            // Gán Class màu sắc dựa trên văn bản xếp loại
            scoreDiv.className = "score";
            if (rankText.toLowerCase().includes("xuất sắc")) {
                rankDiv.className = "score rank-xuat-sac";
                scoreDiv.classList.add("rank-xuat-sac");
            } else if (rankText.toLowerCase().includes("tốt")) {
                rankDiv.className = "score rank-tot";
                scoreDiv.classList.add("rank-tot");
            } else if (rankText.toLowerCase().includes("khá")) {
                rankDiv.className = "score rank-kha";
                scoreDiv.classList.add("rank-kha");
            } else {
                rankDiv.className = "score rank-trung-binh";
                scoreDiv.classList.add("rank-trung-binh");
            }

            // Hiển thị danh sách điểm trừ
            if (foundData.deductions.length === 0) {
                resDeductions.innerHTML = `<tr><td colspan="2" style="text-align:center; color:green; font-weight:bold;">Đơn vị xuất sắc, không bị trừ điểm!</td></tr>`;
            } else {
                foundData.deductions.forEach(item => {
                    let row = `<tr>
                        <td>${item.reason}</td>
                        <td style="color:red; font-weight:bold; text-align:center;">${item.points}</td>
                    </tr>`;
                    resDeductions.innerHTML += row;
                });
            }
        } else {
            resultCard.style.display = "none";
            errorMsg.style.display = "block";
        }
    }

    document.getElementById("unitInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            searchKPI();
        }
    });
</script>
</body>
</html>
